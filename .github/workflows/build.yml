name: Build and push container images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream calcom/cal.diy ref to build (overrides versions.env)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - versions.env
      - .github/workflows/build.yml

env:
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write # GHCR
      id-token: write # keyless Cosign signatures

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate docker image name
        id: name
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "name=${REPO/docker-/}" | tee -a "$GITHUB_OUTPUT"

      - name: Generate OCI image title
        id: title
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "title=${REPO_NAME/docker-/}" | tee -a "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./versions.env
          REF="${REF_INPUT:-$CAL_DIY_REF}"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"
          echo "short=${REF:0:7}" | tee -a "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout calcom/cal.diy
        uses: actions/checkout@v7
        with:
          repository: calcom/cal.diy
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Generate Docker metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          flavor: latest=false
          images: |
            docker.io/${{ steps.name.outputs.name }}
            ghcr.io/${{ steps.name.outputs.name }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.date }}-${{ steps.upstream.outputs.short }}
            type=raw,value=sha-${{ steps.upstream.outputs.short }}
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=${{ steps.title.outputs.title }}
            org.opencontainers.image.source=https://github.com/calcom/cal.diy
            org.opencontainers.image.revision=${{ steps.upstream.outputs.ref }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish container image
        uses: docker/build-push-action@v7
        id: publish
        with:
          push: true
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          build-args: |
            MAX_OLD_SPACE_SIZE=6144
            CALCOM_TELEMETRY_DISABLED=1
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Sign container images
        run: |
          cosign sign --yes --recursive "docker.io/$IMAGE_NAME@$IMAGE_DIGEST"
          cosign sign --yes --recursive "ghcr.io/$IMAGE_NAME@$IMAGE_DIGEST"
        env:
          IMAGE_NAME: ${{ steps.name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
